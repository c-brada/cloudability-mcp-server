[project]
name = "cloudability-mcp-server"
version = "0.1.0"
description = "A Model Context Protocol (MCP) server for Cloudability API integration with comprehensive cost management, container analytics, and budget forecasting tools"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Cloudability MCP Contributors"}
]
keywords = [
    "mcp",
    "model-context-protocol",
    "cloudability",
    "cost-management",
    "kubernetes",
    "container-analytics",
    "cloud-costs",
    "budget-forecasting",
    "finops"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
requires-python = ">=3.14"

dependencies = [
    "fastmcp>=0.19.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.10.0",
    "requests>=2.28.2",
    "truststore>=0.10.4",
]

[project.urls]
Homepage = "https://github.com/eelzinaty/cloudability-mcp-server"
Repository = "https://github.com/eelzinaty/cloudability-mcp-server"
Issues = "https://github.com/eelzinaty/cloudability-mcp-server/issues"
Documentation = "https://github.com/eelzinaty/cloudability-mcp-server#readme"


[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.2.1",
    "responses>=0.25.7",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "integration: live tests against Cloudability API (require credentials in .env)",
]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "-m",
    "not integration",
]

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
explicit_package_bases = true

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["."]
exclude = [
    ".venv",
    "reports",
    ".cursor",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "B",
    "UP",
    "SIM",
]
ignore = [
    "E501",
]
