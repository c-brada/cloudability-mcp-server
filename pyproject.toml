[project]
name = "cloudability-mcp-server"
version = "0.1.0"
description = "A Model Context Protocol (MCP) server for Cloudability API integration with comprehensive cost management, container analytics, and budget forecasting tools"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Cloudability MCP Contributors"}
]
keywords = [
    "mcp",
    "model-context-protocol",
    "cloudability",
    "cost-management",
    "kubernetes",
    "container-analytics",
    "cloud-costs",
    "budget-forecasting",
    "finops"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
requires-python = ">=3.12"

[project.urls]
Homepage = "https://github.com/your-org/cloudability-mcp-server"
Repository = "https://github.com/your-org/cloudability-mcp-server"
Issues = "https://github.com/your-org/cloudability-mcp-server/issues"
Documentation = "https://github.com/your-org/cloudability-mcp-server#readme"

dependencies = [
    "fastapi>=0.116.1",
    "fastmcp>=0.19.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "requests>=2.28.2",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "responses>=0.25.7",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
